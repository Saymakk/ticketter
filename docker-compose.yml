# На сервере: SUPABASE_PROVIDER=cloud и ключи облачного Supabase (*_CLOUD или NEXT_PUBLIC_*).
# Сборка: docker compose --env-file .env build --progress=plain
# На слабом VPS: добавьте swap 2G, сборка 15–40 мин — это нормально.
# Запуск: docker compose --env-file .env up -d
services:
  ticketter:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_HEALTHY_LIFE_SUPABASE_URL: ${NEXT_PUBLIC_HEALTHY_LIFE_SUPABASE_URL}
        NEXT_PUBLIC_HEALTHY_LIFE_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_HEALTHY_LIFE_SUPABASE_ANON_KEY}
    ports:
      # Проверка по IP: http://ВАШ_IP:3001 — затем в UFW: ufw allow 3001/tcp
      # Когда настроите домен и прокси в Apache, смените на "127.0.0.1:3001:3000"
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    environment:
      SUPABASE_PROVIDER: cloud
    restart: unless-stopped
