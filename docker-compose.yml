# На сервере: SUPABASE_PROVIDER=cloud и ключи облачного Supabase (*_CLOUD или NEXT_PUBLIC_*).
# Сборка: docker compose --env-file .env build --progress=plain
# На слабом VPS: добавьте swap 2G, сборка 15–40 мин — это нормально.
# Для пушей Healthy Life: в .env должны быть VAPID-ключи; SKIP_PWA_BUILD не ставьте в 1.
# Запуск: docker compose --env-file .env up -d
services:
  ticketter:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_HEALTHY_LIFE_SUPABASE_URL: ${NEXT_PUBLIC_HEALTHY_LIFE_SUPABASE_URL}
        NEXT_PUBLIC_HEALTHY_LIFE_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_HEALTHY_LIFE_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_HEALTHY_LIFE_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_HEALTHY_LIFE_VAPID_PUBLIC_KEY}
        SKIP_PWA_BUILD: ${SKIP_PWA_BUILD:-}
    ports:
      # Проверка по IP: http://ВАШ_IP:3001 — затем в UFW: ufw allow 3001/tcp
      # Когда настроите домен и прокси в Apache, смените на "127.0.0.1:3001:3000"
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    environment:
      SUPABASE_PROVIDER: cloud
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    environment:
      SUPABASE_PROVIDER: cloud
    restart: unless-stopped
    depends_on:
      - ticketter

  reminders:
    image: curlimages/curl:8.16.0
    env_file:
      - .env
    depends_on:
      - ticketter
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "reminder loop started"
        sleep 20
        while true; do
          curl -sS -o /dev/null -w "reminders HTTP %{http_code}\n" \
            -H "Authorization: Bearer $$HEALTHY_LIFE_CRON_SECRET" \
            "http://ticketter:3000/api/cron/healthy-life-reminders" || true
          sleep 60
        done

